<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>StreamSpace — Video Hub</title>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Arial;background:#0b0c11;color:#f7f7fa;color-scheme:dark}*{box-sizing:border-box}body{margin:0}button,input{font:inherit}button{cursor:pointer}.layout{display:grid;grid-template-columns:230px 1fr;min-height:100vh}.sidebar{border-right:1px solid #252630;padding:24px 15px;background:#101116}.brand{font-weight:850;font-size:24px;display:flex;align-items:center;gap:10px;letter-spacing:-1px}.brand-icon{background:#7d5cff;border-radius:12px;padding:8px;font-size:16px}.nav{margin-top:36px;display:grid;gap:8px}.nav button,.category{background:transparent;border:0;color:#bfc0ce;text-align:left;padding:13px 15px;border-radius:12px}.nav button.active,.nav button:hover,.category.active,.category:hover{background:#252037;color:white}.sidebar-foot{font-size:12px;color:#858696;margin:50px 14px 0;line-height:1.6}.main{padding:24px 36px 60px;min-width:0}header{display:flex;justify-content:space-between;gap:18px;align-items:center}.search{display:flex;align-items:center;gap:8px;background:#1a1b24;border:1px solid #30303e;border-radius:12px;padding:0 14px;max-width:610px;width:100%}.search input{width:100%;padding:13px 0;background:none;border:0;outline:0;color:#fff}.upload,.primary{background:#7858f7;border:0;color:white;font-weight:750;padding:13px 18px;border-radius:12px;white-space:nowrap}.upload:hover,.primary:hover{background:#927cff}.hero{margin-top:28px;min-height:265px;border-radius:24px;background:linear-gradient(100deg,rgba(34,18,66,.97),rgba(56,30,100,.62)),url('https://images.unsplash.com/photo-1485846234645-a62644f84728?w=1500&q=80') center/cover;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;padding:38px}.eyebrow{font-size:12px;letter-spacing:2px;text-transform:uppercase;color:#c1afff;font-weight:800}.hero h1{font-size:clamp(28px,4vw,45px);line-height:1.12;margin:10px 0;letter-spacing:-1.5px}.hero p{color:#d0c7e7;max-width:450px;line-height:1.6}.categories{display:flex;gap:9px;overflow:auto;padding:24px 0 7px}.category{border:1px solid #31303c;background:#1a1b23;padding:9px 15px;white-space:nowrap}.section-head{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-top:24px}.section-head h2{font-size:23px;letter-spacing:-.5px}.section-head span,.empty{color:#a4a4b4}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:27px 20px}.tile{min-width:0}.thumb{width:100%;aspect-ratio:16/9;position:relative;border:0;border-radius:15px;overflow:hidden;padding:0;background:#232435;display:block;text-align:center}.thumb img{height:100%;width:100%;object-fit:cover;transition:transform .3s}.thumb:hover img{transform:scale(1.05)}.play-icon{position:absolute;inset:0;display:grid;place-items:center;font-size:30px;color:white;text-shadow:0 2px 15px #000}.duration{position:absolute;bottom:10px;right:10px;background:#0b0c11dc;border-radius:5px;padding:4px 7px;font-size:12px}.video-meta{display:flex;justify-content:space-between;gap:7px;padding:11px 2px 0}.video-meta h3{margin:0 0 5px;font-size:15px;line-height:1.4}.video-meta p{color:#9395a7;font-size:12px;margin:0}.favorite{border:0;background:none;color:#9d9dab;font-size:20px;padding:0 5px;height:30px}.favorite.on{color:#ff6e9c}.empty{padding:70px 10px;text-align:center;grid-column:1/-1}.overlay{position:fixed;inset:0;background:#000c;z-index:10;display:flex;align-items:center;justify-content:center;padding:20px}.dialog{background:#191a22;border:1px solid #3b3b49;border-radius:20px;max-width:920px;width:100%;overflow:hidden}.dialog-top{padding:15px 18px;display:flex;justify-content:space-between;gap:10px;align-items:center}.dialog-top h2{font-size:18px;margin:0}.close{background:#30313d;color:white;border:0;border-radius:8px;padding:6px 12px}.player{display:block;width:100%;aspect-ratio:16/9;background:#050505}.description{color:#a8a8ba;margin:0;padding:15px 20px 23px;line-height:1.5}.form{padding:18px 22px 25px;display:grid;gap:15px}.field{display:grid;gap:8px;font-size:13px;color:#bdbdce}.field input,.field select{padding:12px;background:#0f1018;border:1px solid #353644;color:white;border-radius:10px}.hint{font-size:12px;line-height:1.6;color:#a1a1b2}footer{border-top:1px solid #242530;margin-top:70px;padding-top:25px;color:#858596;font-size:13px}#fileInput{width:100%}@media(max-width:1050px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.layout{grid-template-columns:190px 1fr}.main{padding:20px}}@media(max-width:680px){.layout{display:block}.sidebar{padding:14px 18px;border-right:0;border-bottom:1px solid #252630}.brand{font-size:21px}.nav{display:flex;margin-top:12px;overflow:auto}.nav button{white-space:nowrap;padding:9px 13px}.sidebar-foot{display:none}.main{padding:18px}.hero{min-height:225px;padding:24px}.hero p{font-size:14px}.grid{gap:22px 12px}.video-meta h3{font-size:13px}header{align-items:stretch}.upload{padding:11px;font-size:13px}.search input{font-size:13px}}
</style>
</head>
<body>
<div class="layout"><aside class="sidebar"><div class="brand"><span class="brand-icon">▶</span> StreamSpace</div><div class="nav"><button class="active" data-page="home">⌂ &nbsp; Home</button><button data-page="trending">↗ &nbsp; Trending</button><button data-page="favorites">♡ &nbsp; Favorites</button><button data-page="uploads">▣ &nbsp; My uploads</button></div><div class="sidebar-foot">Your own video hub.<br>Built for desktop and mobile.</div></aside><main class="main"><header><label class="search">⌕ <input id="search" placeholder="Search videos, creators, topics..." aria-label="Search videos"></label><button class="upload" id="openUpload">＋ Add video</button></header><section class="hero"><span class="eyebrow">YOUR VIDEO UNIVERSE</span><h1>Watch something<br>extraordinary.</h1><p>Discover videos you love, keep your favorites, and add your own content — all in one place.</p><button class="primary" id="explore">Explore videos →</button></section><div id="categories" class="categories"></div><div class="section-head"><h2 id="sectionTitle">Discover videos</h2><span id="count"></span></div><section class="grid" id="grid"></section><footer>© <span id="year"></span> StreamSpace · Demo website · Videos belong to their respective owners.</footer></main></div>
<div id="modalRoot"></div>
<script>
const starter=[
{id:'b1',title:'Big Buck Bunny',creator:'Blender Foundation',category:'Animation',duration:'9:56',views:842000,src:'https://storage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4',image:'https://storage.googleapis.com/gtv-videos-bucket/sample/images/BigBuckBunny.jpg',description:'A fun animated short film.'},
{id:'b2',title:'Elephant Dream',creator:'Blender Foundation',category:'Animation',duration:'10:53',views:639000,src:'https://storage.googleapis.com/gtv-videos-bucket/sample/ElephantsDream.mp4',image:'https://storage.googleapis.com/gtv-videos-bucket/sample/images/ElephantsDream.jpg',description:'An imaginative open movie.'},
{id:'b3',title:'For Bigger Joyrides',creator:'Sample Videos',category:'Travel',duration:'0:15',views:236000,src:'https://storage.googleapis.com/gtv-videos-bucket/sample/ForBiggerJoyrides.mp4',image:'https://storage.googleapis.com/gtv-videos-bucket/sample/images/ForBiggerJoyrides.jpg',description:'A short cinematic video.'},
{id:'b4',title:'For Bigger Escapes',creator:'Sample Videos',category:'Travel',duration:'0:15',views:445000,src:'https://storage.googleapis.com/gtv-videos-bucket/sample/ForBiggerEscapes.mp4',image:'https://storage.googleapis.com/gtv-videos-bucket/sample/images/ForBiggerEscapes.jpg',description:'Enjoy a colorful visual escape.'},
{id:'b5',title:'Sintel',creator:'Blender Foundation',category:'Film',duration:'14:48',views:971000,src:'https://storage.googleapis.com/gtv-videos-bucket/sample/Sintel.mp4',image:'https://storage.googleapis.com/gtv-videos-bucket/sample/images/Sintel.jpg',description:'An animated fantasy short film.'},
{id:'b6',title:'Tears of Steel',creator:'Blender Foundation',category:'Film',duration:'12:14',views:524000,src:'https://storage.googleapis.com/gtv-videos-bucket/sample/TearsOfSteel.mp4',image:'https://storage.googleapis.com/gtv-videos-bucket/sample/images/TearsOfSteel.jpg',description:'A sci-fi short film.'},
{id:'b7',title:'For Bigger Blazes',creator:'Sample Videos',category:'Lifestyle',duration:'0:15',views:173000,src:'https://storage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4',image:'https://storage.googleapis.com/gtv-videos-bucket/sample/images/ForBiggerBlazes.jpg',description:'A crisp sample video.'},
{id:'b8',title:'Subaru Outback On Street',creator:'Sample Videos',category:'Automotive',duration:'0:30',views:380000,src:'https://storage.googleapis.com/gtv-videos-bucket/sample/SubaruOutbackOnStreetAndDirt.mp4',image:'https://storage.googleapis.com/gtv-videos-bucket/sample/images/SubaruOutbackOnStreetAndDirt.jpg',description:'An outdoors driving reel.'},
{id:'b9',title:'Volkswagen GTI Review',creator:'Sample Videos',category:'Automotive',duration:'0:30',views:280000,src:'https://storage.googleapis.com/gtv-videos-bucket/sample/VolkswagenGTIReview.mp4',image:'https://storage.googleapis.com/gtv-videos-bucket/sample/images/VolkswagenGTIReview.jpg',description:'A fun automotive preview.'}];
const stored=(()=>{try{return JSON.parse(localStorage.getItem('streamspace-videos')||'[]')}catch{return []}})();
const favs=new Set((()=>{try{return JSON.parse(localStorage.getItem('streamspace-favs')||'[]')}catch{return []}})());
let videos=[...stored,...starter],page='home',cat='All',search='';const $=s=>document.querySelector(s);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function render(){const cats=['All',...new Set(videos.map(v=>v.category))];$('#categories').innerHTML=cats.map(c=>`<button class="category ${cat===c?'active':''}" data-cat="${esc(c)}">${esc(c)}</button>`).join('');let vs=videos.filter(v=>(cat==='All'||v.category===cat)&&(page!=='favorites'||favs.has(v.id))&&(page!=='uploads'||v.uploaded)&&[v.title,v.creator,v.category].join(' ').toLowerCase().includes(search));if(page==='trending')vs=vs.sort((a,b)=>b.views-a.views);$('#sectionTitle').textContent=({home:'Discover videos',trending:'Trending now',favorites:'Your favorites',uploads:'My uploaded videos'})[page];$('#count').textContent=vs.length+' videos';$('#grid').innerHTML=vs.length?vs.map(v=>`<article class="tile"><button class="thumb" data-play="${esc(v.id)}" aria-label="Play ${esc(v.title)}"><img src="${esc(v.image||'')}" alt="${esc(v.title)}" onerror="this.style.display='none'" loading="lazy"><span class="play-icon">▶</span><span class="duration">${esc(v.duration||'Video')}</span></button><div class="video-meta"><div><h3>${esc(v.title)}</h3><p>${esc(v.creator)} · ${v.views?Intl.NumberFormat('en',{notation:'compact'}).format(v.views)+' views':'Your video'}</p></div><button class="favorite ${favs.has(v.id)?'on':''}" data-fav="${esc(v.id)}" aria-label="Toggle favorite">${favs.has(v.id)?'♥':'♡'}</button></div></article>`).join(''):'<p class="empty">No videos found. Try a different search or category.</p>'}
const modal=$('#modalRoot');function close(){const player=modal.querySelector('video');if(player)player.pause();modal.innerHTML=''};
function play(id){const v=videos.find(x=>x.id===id);if(!v)return;modal.innerHTML=`<div class="overlay"><div class="dialog" role="dialog" aria-modal="true" aria-label="Video player"><div class="dialog-top"><h2>${esc(v.title)}</h2><button class="close">✕ Close</button></div><video class="player" controls autoplay playsinline src="${esc(v.src)}"></video><p class="description">${esc(v.description||'Uploaded to your video website.')} · ${esc(v.creator)}</p></div></div>`;modal.querySelector('.close').onclick=close;modal.querySelector('.overlay').onclick=e=>{if(e.target.classList.contains('overlay'))close()}};
function upload(){modal.innerHTML=`<div class="overlay"><div class="dialog" role="dialog" aria-modal="true" aria-label="Add video"><div class="dialog-top"><h2>Add a video</h2><button class="close">✕ Close</button></div><form id="addForm" class="form"><label class="field">Video title<input name="title" required maxlength="100" placeholder="My awesome video"></label><label class="field">Creator name<input name="creator" maxlength="80" placeholder="Your channel"></label><label class="field">Category<select name="category"><option>Film</option><option>Travel</option><option>Animation</option><option>Automotive</option><option>Lifestyle</option><option>Education</option><option>Music</option><option>Other</option></select></label><label class="field">MP4 / WebM video URL (optional)<input name="url" type="url" placeholder="https://example.com/video.mp4"></label><label class="field">Or choose a local video file<input id="fileInput" type="file" accept="video/*"></label><p class="hint">Note: Links are saved in your browser. Local files can be played during this session but will need reselecting after you reload the page. Hosting files permanently requires a backend or video storage service.</p><button class="primary" type="submit">Add to website</button></form></div></div>`;modal.querySelector('.close').onclick=close;modal.querySelector('.overlay').onclick=e=>{if(e.target.classList.contains('overlay'))close()};$('#addForm').onsubmit=e=>{e.preventDefault();const f=e.currentTarget,file=$('#fileInput').files[0],url=f.elements.url.value.trim();if(!file&&!url){alert('Choose a video file or paste a URL.');return}const v={id:'u'+Date.now(),title:f.elements.title.value.trim(),creator:f.elements.creator.value.trim()||'My channel',category:f.elements.category.value,src:file?URL.createObjectURL(file):url,image:'',duration:'New',views:0,uploaded:true,temporary:!!file};videos.unshift(v);if(!file){localStorage.setItem('streamspace-videos',JSON.stringify(videos.filter(v=>v.uploaded&&!v.temporary)))}page='uploads';cat='All';search='';$('#search').value='';document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));close();render()}}
document.addEventListener('click',e=>{const p=e.target.closest('[data-play]'),f=e.target.closest('[data-fav]'),c=e.target.closest('[data-cat]'),n=e.target.closest('[data-page]');if(p)play(p.dataset.play);if(f){favs.has(f.dataset.fav)?favs.delete(f.dataset.fav):favs.add(f.dataset.fav);localStorage.setItem('streamspace-favs',JSON.stringify([...favs]));render()}if(c){cat=c.dataset.cat;render()}if(n){page=n.dataset.page;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b===n));render()}});$('#search').addEventListener('input',e=>{search=e.target.value.toLowerCase();render()});$('#openUpload').onclick=upload;$('#explore').onclick=()=>$('#grid').scrollIntoView({behavior:'smooth'});document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});$('#year').textContent=new Date().getFullYear();render();
</script></body></html>
